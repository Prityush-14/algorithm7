[project]
name = "algorithm7"
version = "0.1.0"
description = "Head-driven tabular recognizer (Algorithm 7 from Satta & Stock 1994)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
algorithm7 = "algorithm7.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algorithm7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
